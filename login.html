<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login Akun</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: Poppins, sans-serif;
  background: url('https://g.top4top.io/p_3402rp1b90.jpg') no-repeat center center fixed;
  background-size: cover;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  background: rgba(255,255,255,0.62); /* transparan, bisa diubah */
  padding: 38px 32px 28px 32px;
  border-radius: 18px;
  box-shadow: 0 4px 24px rgba(52,152,219,.13);
  max-width: 380px;
  width: 100%;
}
h2 {
  text-align: center;
  margin-bottom: 22px;
  font-weight: 600;
  color: #223;
}
label {
  font-weight: 500;
  margin-top: 12px;
  color: #333;
  display: block;
}
input[type=text],input[type=password] {
  width: 100%;
  padding: 9px 12px;
  margin-top: 5px;
  border: 1.5px solid #b5b5b5;
  border-radius: 8px;
  box-sizing: border-box;
  font-size: 15px;
  background: #fafaff;
}
input[type=text]:focus,input[type=password]:focus {
  border: 1.5px solid #3498db;
  outline: 0;
}
button[type=submit] {
  width: 100%;
  margin-top: 18px;
  padding: 11px;
  background: linear-gradient(90deg,#3498db 60%,#6dd5fa 100%);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
}
.notif {
  text-align: center;
  color: #fff;
  background: #e74c3c;
  padding: 10px 0;
  border-radius: 7px;
  margin-bottom: 14px;
  display: none;
  font-weight: 500;
}
</style>
</head>
<body>
<div class="container">
  <div class="notif" id="notifMsg"></div>
  <h2>Login Akun</h2>
  <form id="loginForm" method="post" action="login.php" autocomplete="off">
    <label>Username:
      <input type="text" name="username" required autocomplete="off">
    </label>
    <label>Password:
      <input type="password" name="password" required>
    </label>
    <button type="submit">Login</button>
  </form>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
    e.preventDefault();
    var formData = new FormData(this);
    fetch(this.action, {method:"POST",body:formData})
    .then(res=>res.text())
    .then(res=>{
        if(res.toLowerCase().includes("sukses")){
            window.location.href = "home/index.html"; // redirect ke dashboard
        } else {
            document.getElementById("notifMsg").style.display="block";
            document.getElementById("notifMsg").innerText = res;
        }
    });
});
</script>
</body>
</html>
